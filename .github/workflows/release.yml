name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:

# Tag our own CI telemetry as internal (see package-checks.yml)
env:
  FIND_RESEARCH_PAPERS_MCP_INTERNAL: "1"

jobs:
  build-distributions:
    name: Build release distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Run tests
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio
          python -m pytest -q -m "not live"

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/*

  publish-to-pypi:
    name: Publish to PyPI
    needs:
      - build-distributions
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-npm:
    name: Publish to npm
    needs:
      - build-distributions
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Sync npm version with release tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('npm/package.json', 'utf8'));
            p.version = '$TAG';
            fs.writeFileSync('npm/package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Publish to npm
        working-directory: npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  smoke-after-publish:
    name: End-user smoke (uvx + npx)
    needs:
      - publish-to-pypi
      - publish-to-npm
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        run: python -m pip install uv

      - name: Smoke the released server exactly like an end user
        run: |
          export FIND_RESEARCH_PAPERS_MCP_TELEMETRY=false
          export FIND_RESEARCH_PAPERS_MCP_INTERNAL=1
          cat > /tmp/smoke_server.py <<'PYEOF'
          import subprocess, json, sys, time
          req = {"jsonrpc": "2.0", "id": 1, "method": "initialize",
                 "params": {"protocolVersion": "2025-06-18", "capabilities": {},
                            "clientInfo": {"name": "post-release-smoke", "version": "1"}}}
          out = subprocess.run(sys.argv[1:], input=json.dumps(req),
                               capture_output=True, text=True, timeout=120)
          line = out.stdout.splitlines()[0] if out.stdout else ""
          d = json.loads(line)
          server = d["result"]["serverInfo"]
          assert server["name"] == "find-research-papers-mcp", server
          print(f"OK: {server['name']} {server['version']}")
          PYEOF
          python /tmp/smoke_server.py uvx --from find-research-papers-mcp find-research-papers-mcp-server
          python /tmp/smoke_server.py npx -y find-research-papers-mcp
